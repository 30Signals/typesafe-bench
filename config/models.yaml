# Models under benchmark.
#
# Jev (typesafe.ai) is called via its own API/SDK.
#
# All other models are reached through a single Azure AI Foundry resource
# (one endpoint + one API key), each identified only by its deployment name.
# To add or swap a model, just add/edit an entry under `models:` -- no code
# changes needed.
#
# Secrets never go in this file -- only the names of the env vars that hold
# them (see .env.example). This file is safe to commit/publish as-is.
#
# input_price_per_1m / output_price_per_1m are USD per 1,000,000 tokens.
# cached_input_price_per_1m is the discounted rate for prompt-cache hits, if
# the provider offers one -- if the API returns a cached-token count for a
# call and this is set, that portion of input tokens is billed at this rate
# instead of input_price_per_1m. Leave any of these as `null` if unknown --
# cost will be reported as "n/a" for that model, and cached-token pricing
# just falls back to the standard input rate.

jev:
  api_key_env: TYPESAFE_API_KEY
  model_id: jev-latest
  input_price_per_1m: 42.0     # $42 / 1B input tokens, per typesafe.ai pricing page
  cached_input_price_per_1m: null
  output_price_per_1m: null    # not published as of 2026-09; fill in if known

azure:
  endpoint_env: AZURE_FOUNDRY_ENDPOINT
  api_key_env: AZURE_FOUNDRY_API_KEY

models:
  - name: gpt-luna
    deployment: gpt-luna
    input_price_per_1m: null
    cached_input_price_per_1m: null
    output_price_per_1m: null

  - name: gpt-sol
    deployment: gpt-sol
    input_price_per_1m: null
    cached_input_price_per_1m: null
    output_price_per_1m: null

  - name: gpt-terra
    deployment: gpt-terra
    input_price_per_1m: null
    cached_input_price_per_1m: null
    output_price_per_1m: null

  - name: claude-haiku
    deployment: claude-haiku
    input_price_per_1m: null
    cached_input_price_per_1m: null
    output_price_per_1m: null

  - name: claude-sonnet
    deployment: claude-sonnet
    input_price_per_1m: null
    cached_input_price_per_1m: null
    output_price_per_1m: null

  - name: claude-opus
    deployment: claude-opus
    input_price_per_1m: null
    cached_input_price_per_1m: null
    output_price_per_1m: null
