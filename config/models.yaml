# Models under benchmark.
#
# Jev (typesafe.ai) is called via its own API/SDK.
#
# All other models are reached through a single Azure AI Foundry resource
# (one endpoint + one API key), each identified only by its deployment name.
# To add or swap a model, just add/edit an entry under `models:` -- no code
# changes needed.
#
# Secrets never go in this file -- only the names of the env vars that hold
# them (see .env.example). This file is safe to commit/publish as-is.
#
# input_price_per_1m / output_price_per_1m are USD per 1,000,000 tokens.
# cached_input_price_per_1m is the discounted rate for prompt-cache reads and
# cache_write_price_per_1m the (usually premium, Anthropic-only) rate for
# writing to the cache -- if the API returns a cache-read/write token count
# for a call and the matching price is set, that portion is billed at that
# rate instead of input_price_per_1m. Leave any of these as `null` if
# unknown -- cost falls back to the standard input rate for that portion.
#
# api_style: how this deployment is actually called on Azure AI Foundry.
#   - "chat_completions" (default): the OpenAI-compatible Chat Completions
#     API via azure-ai-inference. Works for GPT-family and most other models.
#   - "anthropic": Claude deployments on Foundry only respond to the native
#     Anthropic Messages API (<endpoint>/anthropic), not chat_completions --
#     set this explicitly for any Claude model rather than relying on the
#     name-based guess the code falls back to.

jev:
  api_key_env: TYPESAFE_API_KEY
  model_id: jev-latest
  input_price_per_1m: 0.042    # $42 / 1B input tokens, per typesafe.ai pricing page
  cached_input_price_per_1m: null
  output_price_per_1m: 0.0    # not published as of 2026-09; fill in if known

azure:
  endpoint_env: AZURE_FOUNDRY_ENDPOINT
  api_key_env: AZURE_FOUNDRY_API_KEY

models:
  - name: gpt-luna
    deployment: gpt-5.6-luna
    input_price_per_1m: 0.20
    cached_input_price_per_1m: 0.02
    output_price_per_1m: 1.20

  - name: gpt-sol
    deployment: gpt-5.6-sol
    input_price_per_1m: 5.0
    cached_input_price_per_1m: 0.5
    output_price_per_1m: 30.0

  - name: gpt-terra
    deployment: gpt-5.6-terra
    input_price_per_1m: 2.0
    cached_input_price_per_1m: 0.20
    output_price_per_1m: 12.0

  - name: claude-haiku
    deployment: claude-haiku-4-5
    api_style: anthropic
    input_price_per_1m: 1.0
    cached_input_price_per_1m: 0.10
    cache_write_price_per_1m: null   # Anthropic typically charges a ~1.25x premium; fill in if known
    output_price_per_1m: 5

  - name: claude-sonnet
    deployment: claude-sonnet-5
    api_style: anthropic
    input_price_per_1m: 2.0
    cached_input_price_per_1m: 0.20
    cache_write_price_per_1m: null   # Anthropic typically charges a ~1.25x premium; fill in if known
    output_price_per_1m: 10.0

  - name: kimi-k26
    deployment: Kimi-K2.6
    input_price_per_1m: 0.95
    cached_input_price_per_1m: 0.16
    output_price_per_1m: 4
